    <title>농장 시뮬레이터</title>
    <script>
      (() => {
        const STORAGE_KEY = 'orchard_dev_auto_page_reload';
        const GLOBAL_KEY = '__orchardDevAutoPageReloadEnabled';
        const BLOCKED_EVENT = 'orchard:dev-auto-page-reload-blocked';
        const readEnabled = () => {
          try {
            return localStorage.getItem(STORAGE_KEY) !== 'off';
          } catch {
            return true;
          }
        };
        const writeEnabled = (enabled) => {
          const normalized = enabled !== false;
          window[GLOBAL_KEY] = normalized;
          try {
            localStorage.setItem(STORAGE_KEY, normalized ? 'on' : 'off');
          } catch {}
        };
        const notifyBlockedReload = (payloadRaw) => {
          let detail = null;
          try {
            detail = JSON.parse(payloadRaw);
          } catch {}
          window.dispatchEvent(new CustomEvent(BLOCKED_EVENT, { detail }));
        };
        const shouldBlockMessage = (payloadRaw) => {
          if (window[GLOBAL_KEY] !== false) return false;
          if (typeof payloadRaw !== 'string') return false;
          try {
            const payload = JSON.parse(payloadRaw);
            return payload && payload.type === 'full-reload';
          } catch {
            return false;
          }
        };
        const wrapMessageListener = (listener) => function wrappedMessageListener(event) {
          if (shouldBlockMessage(event?.data)) {
            notifyBlockedReload(event.data);
            return;
          }
          return listener.call(this, event);
        };

        window[GLOBAL_KEY] = readEnabled();
        window.__setOrchardDevAutoPageReload = writeEnabled;
        window.addEventListener('storage', (event) => {
          if (event.key !== STORAGE_KEY) return;
          window[GLOBAL_KEY] = event.newValue !== 'off';
        });

        const originalAddEventListener = WebSocket.prototype.addEventListener;
        const wrappedListenerMap = new WeakMap();
        WebSocket.prototype.addEventListener = function patchedAddEventListener(type, listener, options) {
          if (type !== 'message' || typeof listener !== 'function') {
            return originalAddEventListener.call(this, type, listener, options);
          }
          let wrapped = wrappedListenerMap.get(listener);
          if (!wrapped) {
            wrapped = wrapMessageListener(listener);
            wrappedListenerMap.set(listener, wrapped);
          }
          return originalAddEventListener.call(this, type, wrapped, options);
        };

        const onMessageDescriptor = Object.getOwnPropertyDescriptor(WebSocket.prototype, 'onmessage');
        if (onMessageDescriptor?.configurable && typeof onMessageDescriptor.set === 'function') {
          Object.defineProperty(WebSocket.prototype, 'onmessage', {
            configurable: true,
            enumerable: onMessageDescriptor.enumerable ?? true,
            get() {
              return this.__orchardOriginalOnMessage || null;
            },
            set(listener) {
              this.__orchardOriginalOnMessage = listener;
              if (typeof listener !== 'function') {
                onMessageDescriptor.set.call(this, listener);
                return;
              }
              onMessageDescriptor.set.call(this, wrapMessageListener(listener));
            }
          });
        }
      })();
    </script>
