<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>현금 결제 애니메이션</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 18% 18%, rgba(250, 204, 21, 0.16), transparent 28%),
        radial-gradient(circle at 82% 22%, rgba(34, 197, 94, 0.16), transparent 32%),
        radial-gradient(circle at 50% 90%, rgba(59, 130, 246, 0.12), transparent 34%),
        linear-gradient(135deg, #090f1c, #111827 56%, #070b12);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }

    .cash-scene {
      width: min(980px, calc(100vw - 32px));
      min-height: 420px;
      padding: 36px;
      position: relative;
      display: grid;
      grid-template-columns: 1fr 280px 1fr;
      align-items: center;
      gap: 26px;
      overflow: hidden;
      border-radius: 36px;
      background:
        linear-gradient(135deg, rgba(255,255,255,0.12), rgba(255,255,255,0.035)),
        rgba(10, 18, 32, 0.86);
      border: 1px solid rgba(255,255,255,0.13);
      box-shadow:
        0 34px 90px rgba(0,0,0,0.46),
        inset 0 1px 0 rgba(255,255,255,0.16);
      backdrop-filter: blur(18px);
    }

    .cash-scene::before {
      content: "";
      position: absolute;
      inset: -55%;
      background: conic-gradient(
        from 180deg,
        transparent,
        rgba(250, 204, 21, 0.16),
        transparent,
        rgba(34, 197, 94, 0.15),
        transparent,
        rgba(59, 130, 246, 0.14),
        transparent
      );
      animation: bgSpin 8s linear infinite;
    }

    .cash-scene::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
      background-size: 34px 34px;
      mask-image: radial-gradient(circle at center, black, transparent 72%);
      opacity: 0.55;
      pointer-events: none;
    }

    .cash-scene > * {
      position: relative;
      z-index: 1;
    }

    .wallet-zone,
    .register-zone {
      min-height: 265px;
      padding: 24px;
      border-radius: 30px;
      position: relative;
      background:
        linear-gradient(135deg, rgba(255,255,255,0.12), rgba(255,255,255,0.04)),
        rgba(15, 23, 42, 0.82);
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow:
        0 24px 55px rgba(0,0,0,0.28),
        inset 0 1px 0 rgba(255,255,255,0.14);
    }

    .zone-label {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 12px;
      border-radius: 999px;
      color: #fff7cc;
      background: rgba(250, 204, 21, 0.13);
      border: 1px solid rgba(250, 204, 21, 0.28);
      font-size: 13px;
      font-weight: 900;
      letter-spacing: -0.02em;
    }

    .wallet {
      width: 214px;
      height: 127px;
      position: absolute;
      left: 30px;
      bottom: 42px;
      border: 3px solid #4f2c19;
      border-radius: 18px;
      background:
        linear-gradient(145deg, rgba(255,255,255,0.13), transparent 38%),
        #a96135;
      box-shadow:
        0 9px 0 #6c3b20,
        0 22px 34px rgba(0,0,0,0.32),
        inset 0 3px 0 rgba(255,255,255,0.16),
        inset 0 -5px 0 rgba(70,35,18,0.23);
      animation: walletBounce 3.6s ease-in-out infinite;
      isolation: isolate;
    }

    .wallet::before {
      content: "";
      position: absolute;
      inset: 8px;
      z-index: 1;
      border: 1px dashed rgba(255,220,167,0.66);
      border-radius: 12px;
      pointer-events: none;
    }

    .wallet::after {
      content: "";
      position: absolute;
      top: 9px;
      bottom: 9px;
      left: 50%;
      z-index: 1;
      width: 2px;
      border-radius: 10px;
      background: rgba(79,44,25,0.33);
      box-shadow: 2px 0 rgba(255,255,255,0.08);
    }

    .id-pocket {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 4;
      width: 86px;
      height: 70px;
    }

    .id-pocket::before {
      content: "";
      position: absolute;
      top: 7px;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 0;
      border: 3px solid #59311d;
      border-radius: 10px;
      background: #76401f;
      box-shadow:
        inset 0 -5px 0 rgba(54,28,15,0.22),
        0 3px 0 rgba(255,255,255,0.07);
    }

    .id-card {
      position: absolute;
      top: 0;
      left: 1px;
      z-index: 1;
      width: 84px;
      height: 53px;
      overflow: hidden;
      border: 3px solid #ece6da;
      border-radius: 8px;
      background: #f8f3e9;
      box-shadow:
        0 3px 0 rgba(47,25,14,0.28),
        0 5px 8px rgba(47,25,14,0.14);
      transform: rotate(-2.5deg);
      transform-origin: center bottom;
    }

    .id-header {
      height: 13px;
      background: linear-gradient(90deg, #78afd0, #4a98c3);
    }

    .id-photo {
      position: absolute;
      top: 19px;
      left: 7px;
      width: 21px;
      height: 25px;
      overflow: hidden;
      border-radius: 4px;
      background: #d7e5eb;
    }

    .id-photo::before {
      content: "";
      position: absolute;
      top: 4px;
      left: 7px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #6598b9;
    }

    .id-photo::after {
      content: "";
      position: absolute;
      bottom: -5px;
      left: 3px;
      width: 15px;
      height: 16px;
      border-radius: 50% 50% 3px 3px;
      background: #6598b9;
    }

    .id-info {
      position: absolute;
      top: 19px;
      left: 34px;
      right: 6px;
    }

    .id-line {
      height: 4px;
      margin-bottom: 5px;
      border-radius: 10px;
      background: #b9b7b2;
    }

    .id-line:nth-child(1) {
      width: 32px;
      background: #4e91b2;
    }

    .id-line:nth-child(2) {
      width: 39px;
    }

    .id-line:nth-child(3) {
      width: 26px;
    }

    .id-mark {
      position: absolute;
      right: 6px;
      bottom: 5px;
      width: 15px;
      height: 7px;
      border-radius: 3px;
      background: #e8ae48;
    }

    .pocket-front {
      position: absolute;
      top: 39px;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 2;
      border: 3px solid #59311d;
      border-radius: 4px 4px 10px 10px;
      background:
        linear-gradient(to bottom, rgba(255,255,255,0.07), transparent 35%),
        #8c4d29;
      box-shadow:
        inset 0 -4px 0 rgba(54,28,15,0.2),
        0 3px 0 rgba(255,255,255,0.06);
    }

    .pocket-front::before {
      content: "";
      position: absolute;
      top: -3px;
      left: 5px;
      right: 5px;
      height: 3px;
      border-radius: 10px;
      background: #59311d;
    }

    .coin-pocket {
      position: absolute;
      top: 22px;
      right: 23px;
      z-index: 3;
      width: 75px;
      height: 77px;
      border: 3px solid #56301c;
      border-radius: 14px;
      background:
        linear-gradient(145deg, rgba(255,255,255,0.08), transparent 45%),
        #ae6838;
      box-shadow:
        0 5px 0 rgba(82,42,21,0.26),
        inset 0 -5px 0 rgba(73,36,18,0.18);
    }

    .wallet-logo {
      position: absolute;
      left: 31px;
      bottom: 15px;
      z-index: 4;
      width: 49px;
      height: 19px;
      display: grid;
      place-items: center;
      border: 2px solid rgba(78,42,24,0.7);
      border-radius: 50%;
      color: rgba(77,41,23,0.86);
      font-family: Arial, sans-serif;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 0.7px;
      transform: rotate(-2deg);
    }

    .strap {
      position: absolute;
      top: 44px;
      right: -17px;
      z-index: 6;
      width: 52px;
      height: 37px;
      border: 3px solid #4f2c19;
      border-radius: 10px;
      background:
        linear-gradient(145deg, rgba(255,255,255,0.12), transparent 40%),
        #a86437;
      box-shadow:
        0 5px 0 #6e3d22,
        inset 0 3px 0 rgba(255,255,255,0.14);
    }

    .wallet-button {
      position: absolute;
      top: 9px;
      left: 14px;
      width: 13px;
      height: 13px;
      border: 3px solid #67531e;
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 30%, #fff3ad, #d5a52d 65%, #a77613);
      box-shadow: 0 2px 0 rgba(56,33,11,0.34);
    }

    .wallet-title {
      position: absolute;
      left: 30px;
      bottom: 184px;
      color: white;
      font-size: 28px;
      font-weight: 950;
      letter-spacing: -0.06em;
    }

    .wallet-sub {
      position: absolute;
      left: 32px;
      bottom: 158px;
      color: rgba(255,255,255,0.6);
      font-size: 14px;
    }

    .payment-lane {
      height: 280px;
      position: relative;
      display: grid;
      place-items: center;
    }

    .lane-line {
      width: 100%;
      height: 9px;
      border-radius: 999px;
      position: relative;
      overflow: hidden;
      background: rgba(255,255,255,0.12);
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,0.08),
        0 0 30px rgba(250, 204, 21, 0.12);
    }

    .lane-line::before {
      content: "";
      position: absolute;
      inset: 0;
      transform: translateX(-100%);
      background: linear-gradient(90deg, transparent, #facc15, #22c55e, transparent);
      animation: laneCharge 3.6s ease-in-out infinite;
    }

    .lane-line::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image: repeating-linear-gradient(
        90deg,
        transparent 0 13px,
        rgba(255,255,255,0.3) 13px 17px
      );
      opacity: 0.4;
      animation: dashMove 0.65s linear infinite;
    }

    .flying-bill {
      width: 112px;
      height: 54px;
      position: absolute;
      left: -48px;
      top: 95px;
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #052e16;
      font-size: 22px;
      font-weight: 950;
      letter-spacing: -0.04em;
      background:
        radial-gradient(circle at 27px 27px, rgba(255,255,255,0.45) 0 12px, transparent 13px),
        radial-gradient(circle at 85px 27px, rgba(5,46,22,0.12) 0 13px, transparent 14px),
        linear-gradient(135deg, #dcfce7, #4ade80 52%, #16a34a);
      border: 1px solid rgba(255,255,255,0.42);
      box-shadow:
        0 18px 35px rgba(34, 197, 94, 0.26),
        inset 0 1px 0 rgba(255,255,255,0.75);
      opacity: 0;
      transform-origin: center;
    }

    .bill-value {
      position: relative;
      z-index: 3;
      padding-top: 3px;
      text-shadow: 0 1px 0 rgba(255,255,255,0.24);
    }

    .flying-bill::before,
    .flying-bill::after {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid rgba(5, 46, 22, 0.18);
    }

    .flying-bill::before {
      left: 11px;
      top: 10px;
    }

    .flying-bill::after {
      right: 11px;
      bottom: 10px;
    }

    .bill-serial {
      position: absolute;
      left: 12px;
      top: 6px;
      z-index: 3;
      color: rgba(5,46,22,0.55);
      font-size: 7px;
      font-weight: 900;
      letter-spacing: 0.08em;
    }

    .bill-banknote-mark {
      position: absolute;
      right: 13px;
      top: 8px;
      z-index: 3;
      width: 18px;
      height: 13px;
      border-radius: 4px;
      border: 1px solid rgba(5,46,22,0.22);
      background:
        linear-gradient(135deg, rgba(255,255,255,0.26), transparent),
        rgba(22,101,52,0.15);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.3);
    }

    .bill-banknote-mark::before {
      content: "";
      position: absolute;
      inset: 3px 5px;
      border-radius: 50%;
      border: 1px solid rgba(5,46,22,0.22);
    }

    .bill-lines {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 7px;
      z-index: 2;
      display: grid;
      gap: 3px;
      opacity: 0.44;
    }

    .bill-lines span {
      height: 2px;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(5,46,22,0.24), transparent 72%);
    }

    .bill-lines span:nth-child(2) {
      width: 68%;
    }

    .bill-1 {
      animation: billFly1 3.6s cubic-bezier(.18,.88,.24,1) infinite;
    }

    .bill-2 {
      top: 116px;
      animation: billFly2 3.6s cubic-bezier(.18,.88,.24,1) infinite;
      animation-delay: 0.13s;
    }

    .bill-3 {
      top: 78px;
      animation: billFly3 3.6s cubic-bezier(.18,.88,.24,1) infinite;
      animation-delay: 0.26s;
    }

    .coin {
      width: 31px;
      height: 31px;
      position: absolute;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: #3b2700;
      font-size: 15px;
      font-weight: 950;
      background:
        radial-gradient(circle at 33% 28%, rgba(255,255,255,0.7), transparent 22%),
        linear-gradient(135deg, #fde68a, #f59e0b);
      box-shadow:
        0 12px 24px rgba(245, 158, 11, 0.34),
        inset 0 1px 0 rgba(255,255,255,0.55);
      opacity: 0;
    }

    .coin::before {
      content: "";
      position: absolute;
      inset: 4px;
      border-radius: 50%;
      border: 2px solid rgba(120, 53, 15, 0.28);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.34),
        0 1px 0 rgba(255,255,255,0.18);
    }

    .coin::after {
      content: "";
      position: absolute;
      inset: 10px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 25%, rgba(255,255,255,0.34), transparent 42%),
        rgba(146,64,14,0.18);
      box-shadow: inset 0 1px 2px rgba(59,39,0,0.25);
    }

    .coin-value {
      position: relative;
      z-index: 2;
    }

    .coin-1 {
      left: 28px;
      top: 54px;
      animation: coinPop 3.6s ease-out infinite;
    }

    .coin-2 {
      left: 105px;
      top: 175px;
      animation: coinPop 3.6s ease-out infinite;
      animation-delay: 0.14s;
    }

    .coin-3 {
      left: 190px;
      top: 48px;
      animation: coinPop 3.6s ease-out infinite;
      animation-delay: 0.28s;
    }

    .cash-label {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 9px 14px;
      border-radius: 999px;
      color: #dcfce7;
      font-size: 14px;
      font-weight: 950;
      white-space: nowrap;
      background: rgba(34, 197, 94, 0.13);
      border: 1px solid rgba(34, 197, 94, 0.28);
      box-shadow: 0 14px 30px rgba(34,197,94,0.12);
      animation: cashLabelPulse 3.6s ease-in-out infinite;
    }

    .register {
      width: 260px;
      min-height: 228px;
      position: absolute;
      right: 14px;
      bottom: 26px;
      padding: 18px 14px 16px;
      padding-bottom: 48px;
      overflow: visible;
      border-radius: 22px 22px 18px 18px;
      background:
        linear-gradient(145deg, rgba(255,255,255,0.1), transparent 32%),
        linear-gradient(165deg, #315748, #1e392f 58%, #152c25);
      border: 1px solid rgba(27, 52, 42, 0.32);
      box-shadow:
        0 18px 35px rgba(18, 29, 24, 0.32),
        0 12px 0 rgba(23, 44, 36, 0.12),
        inset 0 1px 0 rgba(255,255,255,0.2);
      animation: registerBump 3.6s ease-in-out infinite;
    }

    .register::before {
      content: "";
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 10px;
      height: 5px;
      border-radius: 999px;
      background: rgba(4, 19, 13, 0.38);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
    }

    .register::after {
      content: "";
      position: absolute;
      inset: 10px;
      border-radius: 18px 18px 14px 14px;
      border: 1px solid rgba(220,252,231,0.08);
      pointer-events: none;
    }

    .terminal-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 9px;
      padding: 0 3px;
      color: rgba(220, 252, 231, 0.8);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.08em;
      position: relative;
      z-index: 25;
    }

    .terminal-led {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #facc15;
      box-shadow: 0 0 0 4px rgba(250, 204, 21, 0.14);
      animation: ledBlink 3.6s ease-in-out infinite;
    }

    .register-screen {
      min-height: 96px;
      position: relative;
      z-index: 25;
      overflow: hidden;
      border-radius: 14px;
      background:
        radial-gradient(circle at 50% 0%, rgba(98, 236, 156, 0.14), transparent 55%),
        linear-gradient(165deg, #0b231c, #123328);
      border: 1px solid rgba(160, 234, 196, 0.28);
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.04),
        inset 0 -18px 26px rgba(0, 0, 0, 0.18);
      display: grid;
      place-items: center;
      color: #cbf7df;
      font-size: 20px;
      font-weight: 950;
      letter-spacing: -0.04em;
    }

    .register-screen::before {
      content: "결제금액\A ₩8,000";
      white-space: pre;
      line-height: 1.42;
      animation: screenText 3.6s ease-in-out infinite;
    }

    .register-screen::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, transparent, rgba(255,255,255,0.12), transparent),
        repeating-linear-gradient(
          180deg,
          rgba(255,255,255,0.035) 0 1px,
          transparent 1px 4px
        );
      transform: translateX(-120%);
      animation: screenScan 3.6s ease-in-out infinite;
      pointer-events: none;
    }

    .screen-detail {
      position: absolute;
      inset: 10px 12px;
      z-index: 27;
      pointer-events: none;
    }

    .screen-status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: rgba(203,247,223,0.58);
      font-size: 8px;
      font-weight: 900;
      letter-spacing: 0.08em;
    }

    .screen-chip {
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }

    .screen-chip::before {
      content: "";
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #86efac;
      box-shadow: 0 0 8px rgba(134,239,172,0.48);
    }

    .screen-mini-lines {
      position: absolute;
      left: 4px;
      right: 4px;
      bottom: 0;
      display: grid;
      gap: 4px;
      opacity: 0.42;
    }

    .screen-mini-lines span {
      height: 2px;
      border-radius: 999px;
      background: rgba(203,247,223,0.5);
    }

    .screen-mini-lines span:nth-child(2) {
      width: 62%;
    }

    .screen-mini-lines span:nth-child(3) {
      width: 78%;
    }

    .register-buttons {
      margin-top: 13px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
      width: 132px;
      margin-left: auto;
      margin-right: auto;
      position: relative;
      z-index: 18;
    }

    .register-buttons span {
      height: 13px;
      border-radius: 5px;
      background: rgba(255,255,255,0.17);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.16),
        0 1px 0 rgba(0,0,0,0.14);
      animation: keypadTap 3.6s ease-in-out infinite;
    }

    .terminal-control-row {
      width: 132px;
      margin: 8px auto 0;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
      position: relative;
      z-index: 18;
    }

    .terminal-control-row span {
      height: 12px;
      border-radius: 999px;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.18),
        0 1px 0 rgba(0,0,0,0.16);
    }

    .terminal-control-row span:nth-child(1) {
      background: rgba(239,68,68,0.72);
    }

    .terminal-control-row span:nth-child(2) {
      background: rgba(250,204,21,0.72);
    }

    .terminal-control-row span:nth-child(3) {
      background: rgba(34,197,94,0.72);
      animation: approvePulse 3.6s ease-in-out infinite;
    }

    .terminal-slot-label {
      position: absolute;
      left: 50%;
      bottom: 39px;
      transform: translateX(-50%);
      z-index: 39;
      color: rgba(220,252,231,0.48);
      font-size: 8px;
      font-weight: 900;
      letter-spacing: 0.12em;
      pointer-events: none;
    }

    .scanner {
      width: 81%;
      height: 10px;
      position: absolute;
      left: 50%;
      bottom: 26px;
      z-index: 40;
      overflow: hidden;
      border-radius: 999px;
      transform: translateX(-50%);
      background: rgba(6, 17, 13, 0.88);
      border: 1px solid rgba(255,255,255,0.17);
      box-shadow:
        inset 0 2px 6px rgba(0,0,0,0.56),
        0 0 0 rgba(134,239,172,0);
      animation: slotGlow 3.6s ease-in-out infinite;
    }

    .scanner::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      width: 42%;
      left: -44%;
      border-radius: inherit;
      background: linear-gradient(90deg, transparent, #86efac, transparent);
      animation: slotSweep 3.6s ease-in-out infinite;
    }

    .scanner::after {
      content: "";
      position: absolute;
      inset: 3px 18px;
      border-radius: inherit;
      background: rgba(255,255,255,0.08);
      pointer-events: none;
    }

    .receipt {
      width: 132px;
      height: 126px;
      position: absolute;
      left: 50%;
      top: calc(100% - 31px);
      z-index: 32;
      border-radius: 0 0 15px 15px;
      background:
        repeating-linear-gradient(
          180deg,
          transparent 0 13px,
          rgba(24,54,42,0.08) 13px 15px
        ),
        linear-gradient(180deg, #ffffff, #eef3ee);
      box-shadow:
        0 18px 28px rgba(18,29,24,0.24),
        inset 0 1px 0 rgba(255,255,255,0.9);
      transform: translateX(-50%) scaleY(0.04);
      opacity: 0;
      transform-origin: top center;
      animation: receiptPrint 3.6s ease-in-out infinite;
    }

    .receipt::before {
      content: "PAID";
      position: absolute;
      left: 50%;
      top: 52px;
      transform: translate(-50%, -50%) rotate(-12deg) scale(0.7);
      padding: 5px 8px;
      border-radius: 7px;
      color: #16a34a;
      border: 3px solid #16a34a;
      font-size: 17px;
      font-weight: 950;
      letter-spacing: 0.03em;
      opacity: 0;
      animation: paidStamp 3.6s ease-in-out infinite;
    }

    .receipt::after {
      content: "";
      position: absolute;
      left: 17px;
      right: 17px;
      top: 18px;
      height: 38px;
      background:
        linear-gradient(#244335 0 0) 0 0 / 100% 3px no-repeat,
        linear-gradient(#244335 0 0) 0 12px / 74% 3px no-repeat,
        linear-gradient(#244335 0 0) 0 24px / 88% 3px no-repeat,
        linear-gradient(#244335 0 0) 0 36px / 56% 3px no-repeat;
      opacity: 0.14;
    }

    .done-toast {
      position: absolute;
      right: 28px;
      top: 26px;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 11px 15px;
      border-radius: 999px;
      color: #ecfccb;
      font-size: 14px;
      font-weight: 950;
      background: rgba(132, 204, 22, 0.14);
      border: 1px solid rgba(132, 204, 22, 0.33);
      box-shadow: 0 18px 35px rgba(132, 204, 22, 0.13);
      opacity: 0;
      transform: translateY(8px) scale(0.92);
      animation: doneToast 3.6s ease-in-out infinite;
    }

    .done-icon {
      width: 21px;
      height: 21px;
      position: relative;
      border-radius: 50%;
      background: #84cc16;
      box-shadow: 0 0 0 5px rgba(132, 204, 22, 0.14);
    }

    .done-icon::before {
      content: "";
      position: absolute;
      width: 10px;
      height: 6px;
      left: 5px;
      top: 6px;
      border-left: 3px solid #152006;
      border-bottom: 3px solid #152006;
      transform: rotate(-45deg);
    }

    @keyframes bgSpin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes walletBounce {
      0%, 100% {
        transform: translateY(0) rotate(0);
      }

      14% {
        transform: translateY(-5px) rotate(-1deg);
      }

      28% {
        transform: translateY(0) rotate(0);
      }
    }

    @keyframes miniCashPeek {
      0%, 10%, 100% {
        transform: translateY(0) rotate(-5deg);
      }

      18% {
        transform: translateY(-16px) rotate(-8deg);
      }

      32% {
        transform: translateY(0) rotate(-5deg);
      }
    }

    @keyframes laneCharge {
      0%, 12% {
        transform: translateX(-100%);
      }

      68% {
        transform: translateX(0);
      }

      100% {
        transform: translateX(100%);
      }
    }

    @keyframes dashMove {
      to {
        background-position-x: 34px;
      }
    }

    @keyframes billFly1 {
      0%, 10% {
        left: -54px;
        opacity: 0;
        transform: translateY(18px) rotate(-18deg) scale(0.72);
      }

      17% {
        opacity: 1;
      }

      38% {
        transform: translateY(-48px) rotate(12deg) scale(1.05);
      }

      62% {
        transform: translateY(30px) rotate(-10deg) scale(0.98);
      }

      74% {
        left: calc(100% - 58px);
        opacity: 1;
        transform: translateY(0) rotate(4deg) scale(0.92);
      }

      86%, 100% {
        left: calc(100% - 48px);
        opacity: 0;
        transform: translateY(0) rotate(0deg) scale(0.45);
      }
    }

    @keyframes billFly2 {
      0%, 14% {
        left: -54px;
        opacity: 0;
        transform: translateY(28px) rotate(16deg) scale(0.68);
      }

      22% {
        opacity: 1;
      }

      42% {
        transform: translateY(38px) rotate(-14deg) scale(1.03);
      }

      64% {
        transform: translateY(-32px) rotate(9deg) scale(0.98);
      }

      76% {
        left: calc(100% - 60px);
        opacity: 1;
        transform: translateY(0) rotate(-3deg) scale(0.9);
      }

      88%, 100% {
        left: calc(100% - 48px);
        opacity: 0;
        transform: translateY(0) rotate(0deg) scale(0.44);
      }
    }

    @keyframes billFly3 {
      0%, 18% {
        left: -54px;
        opacity: 0;
        transform: translateY(-10px) rotate(-10deg) scale(0.66);
      }

      26% {
        opacity: 1;
      }

      48% {
        transform: translateY(-28px) rotate(18deg) scale(1.06);
      }

      66% {
        transform: translateY(44px) rotate(-9deg) scale(0.96);
      }

      78% {
        left: calc(100% - 62px);
        opacity: 1;
        transform: translateY(0) rotate(5deg) scale(0.88);
      }

      90%, 100% {
        left: calc(100% - 48px);
        opacity: 0;
        transform: translateY(0) rotate(0deg) scale(0.42);
      }
    }

    @keyframes coinPop {
      0%, 19% {
        opacity: 0;
        transform: translate(0, 0) scale(0.5) rotate(0);
      }

      31% {
        opacity: 1;
      }

      56% {
        opacity: 0;
        transform: translate(42px, -30px) scale(1.08) rotate(280deg);
      }

      100% {
        opacity: 0;
      }
    }

    @keyframes cashLabelPulse {
      0%, 10%, 100% {
        opacity: 0.55;
        transform: translateX(-50%) translateY(0) scale(0.96);
      }

      24%, 62% {
        opacity: 1;
        transform: translateX(-50%) translateY(-3px) scale(1);
      }
    }

    @keyframes registerBump {
      0%, 58%, 100% {
        transform: translateY(0) scale(1);
      }

      70% {
        transform: translateY(-5px) scale(1.025);
      }

      80% {
        transform: translateY(0) scale(1);
      }
    }

    @keyframes screenText {
      0%, 58% {
        content: "결제금액\A ₩8,000";
        color: #fde68a;
      }

      70%, 100% {
        content: "현금 결제 완료";
        color: #86efac;
      }
    }

    @keyframes ledBlink {
      0%, 42% {
        background: #facc15;
        box-shadow: 0 0 0 4px rgba(250, 204, 21, 0.14);
      }

      55%, 68% {
        background: #60a5fa;
        box-shadow:
          0 0 0 4px rgba(96, 165, 250, 0.14),
          0 0 18px rgba(96, 165, 250, 0.45);
      }

      82%, 100% {
        background: #86efac;
        box-shadow:
          0 0 0 4px rgba(134, 239, 172, 0.16),
          0 0 20px rgba(134, 239, 172, 0.55);
      }
    }

    @keyframes screenScan {
      0%, 8% {
        transform: translateX(-120%);
      }

      44%, 78%, 100% {
        transform: translateX(120%);
      }
    }

    @keyframes slotGlow {
      0%, 18%, 72%, 100% {
        box-shadow:
          inset 0 2px 6px rgba(0, 0, 0, 0.56),
          0 0 0 rgba(134, 239, 172, 0);
      }

      34%, 56% {
        box-shadow:
          inset 0 2px 6px rgba(0, 0, 0, 0.56),
          0 0 18px rgba(134, 239, 172, 0.58),
          0 0 38px rgba(134, 239, 172, 0.24);
      }
    }

    @keyframes slotSweep {
      0%, 22% {
        left: -44%;
        opacity: 0;
      }

      34% {
        opacity: 1;
      }

      62% {
        left: 102%;
        opacity: 1;
      }

      100% {
        left: 102%;
        opacity: 0;
      }
    }

    @keyframes keypadTap {
      0%, 46%, 100% {
        transform: translateY(0);
        background: rgba(255,255,255,0.17);
      }

      52%, 61% {
        transform: translateY(1px);
        background: rgba(134,239,172,0.42);
      }
    }

    @keyframes approvePulse {
      0%, 55%, 100% {
        transform: translateY(0);
        filter: brightness(1);
        box-shadow:
          inset 0 1px 0 rgba(255,255,255,0.18),
          0 1px 0 rgba(0,0,0,0.16);
      }

      72%, 86% {
        transform: translateY(1px);
        filter: brightness(1.18);
        box-shadow:
          0 0 14px rgba(34,197,94,0.44),
          inset 0 1px 0 rgba(255,255,255,0.24),
          0 1px 0 rgba(0,0,0,0.16);
      }
    }

    @keyframes receiptPrint {
      0%, 62% {
        opacity: 0;
        transform: translateX(-50%) translateY(-6px) scaleY(0.02);
      }

      72% {
        opacity: 1;
        transform: translateX(-50%) translateY(0) scaleY(0.42);
      }

      88% {
        opacity: 1;
        transform: translateX(-50%) scaleY(1);
      }

      100% {
        opacity: 0;
        transform: translateX(-50%) translateY(-8px) scaleY(1);
      }
    }

    @keyframes paidStamp {
      0%, 73% {
        opacity: 0;
        transform: translate(-50%, -50%) rotate(-12deg) scale(1.35);
      }

      79%, 91% {
        opacity: 1;
        transform: translate(-50%, -50%) rotate(-12deg) scale(1);
      }

      100% {
        opacity: 0;
        transform: translate(-50%, -50%) rotate(-12deg) scale(1);
      }
    }

    @keyframes doneToast {
      0%, 72% {
        opacity: 0;
        transform: translateY(8px) scale(0.92);
      }

      80%, 92% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }

      100% {
        opacity: 0;
        transform: translateY(-7px) scale(0.96);
      }
    }

    @media (max-width: 830px) {
      body {
        overflow-y: auto;
      }

      .cash-scene {
        grid-template-columns: 1fr;
        min-height: 760px;
        padding: 24px;
      }

      .wallet-zone,
      .register-zone {
        min-height: 230px;
      }

      .payment-lane {
        height: 180px;
        transform: rotate(90deg);
      }

      .cash-label {
        transform: translateX(-50%) rotate(-90deg);
      }

      .wallet {
        left: 24px;
      }

      .wallet-title {
        left: 26px;
      }

      .wallet-sub {
        left: 28px;
      }

      .register {
        right: 24px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }

      .flying-bill,
      .coin {
        opacity: 1;
      }

      .receipt,
      .done-toast {
        opacity: 1;
        transform: none;
      }
    }
  </style>
</head>

<body>
  <div class="cash-scene">
    <section class="wallet-zone">
      <div class="wallet-title">현금 꺼내는 중</div>

      <div class="wallet">
        <div class="id-pocket">
          <div class="id-card">
            <div class="id-header"></div>
            <div class="id-photo"></div>
            <div class="id-info">
              <div class="id-line"></div>
              <div class="id-line"></div>
              <div class="id-line"></div>
            </div>
            <div class="id-mark"></div>
          </div>
          <div class="pocket-front"></div>
        </div>
        <div class="coin-pocket"></div>
        <div class="wallet-logo">FARM</div>
        <div class="strap">
          <div class="wallet-button"></div>
        </div>
      </div>
    </section>

    <section class="payment-lane">
      <div class="cash-label">현금 전달 중</div>

      <div class="lane-line"></div>

      <div class="flying-bill bill-1">
        <span class="bill-serial">KR 10000</span>
        <span class="bill-banknote-mark"></span>
        <span class="bill-value">₩10,000</span>
        <span class="bill-lines"><span></span><span></span></span>
      </div>
      <div class="flying-bill bill-2">
        <span class="bill-serial">KR 05000</span>
        <span class="bill-banknote-mark"></span>
        <span class="bill-value">₩5,000</span>
        <span class="bill-lines"><span></span><span></span></span>
      </div>
      <div class="flying-bill bill-3">
        <span class="bill-serial">KR 01000</span>
        <span class="bill-banknote-mark"></span>
        <span class="bill-value">₩1,000</span>
        <span class="bill-lines"><span></span><span></span></span>
      </div>

      <span class="coin coin-1"><span class="coin-value">₩</span></span>
      <span class="coin coin-2"><span class="coin-value">₩</span></span>
      <span class="coin coin-3"><span class="coin-value">₩</span></span>
    </section>

    <section class="register-zone">
      <div class="done-toast">
        <span class="done-icon"></span>
        현금 결제 완료
      </div>

      <div class="register">
        <div class="terminal-top">
          <span>CASH PAY</span>
          <span class="terminal-led"></span>
        </div>
        <div class="register-screen">
          <div class="screen-detail">
            <div class="screen-status-row">
              <span class="screen-chip">ONLINE</span>
              <span>NO. 03</span>
            </div>
            <div class="screen-mini-lines">
              <span></span>
              <span></span>
              <span></span>
            </div>
          </div>
        </div>

        <div class="register-buttons">
          <span></span><span></span><span></span>
          <span></span><span></span><span></span>
          <span></span><span></span><span></span>
        </div>

        <div class="terminal-control-row">
          <span></span><span></span><span></span>
        </div>

        <div class="terminal-slot-label">RECEIPT</div>
        <div class="scanner"></div>
        <div class="receipt"></div>
      </div>
    </section>
  </div>
</body>
</html>
