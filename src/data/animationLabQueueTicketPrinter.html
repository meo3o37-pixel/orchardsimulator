<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>번호표 출력 애니메이션</title>

<style>
  :root {
    --cycle: 4.8s;
  }

  * {
    box-sizing: border-box;
  }

  body {
    min-height: 100vh;
    margin: 0;
    display: grid;
    place-items: center;
    overflow: hidden;
    font-family:
      Pretendard,
      "Noto Sans KR",
      "Apple SD Gothic Neo",
      system-ui,
      sans-serif;
    background:
      radial-gradient(circle at 50% 18%, #f8fafc 0%, transparent 48%),
      linear-gradient(180deg, #dce3e9 0%, #b9c2c9 100%);
  }

  .scene {
    position: relative;
    width: min(94vw, 760px);
    aspect-ratio: 760 / 520;
    overflow: hidden;
    isolation: isolate;
    border: 1px solid rgba(255, 255, 255, 0.75);
    border-radius: clamp(18px, 3vw, 32px);
    background:
      radial-gradient(
        ellipse at 44% 83%,
        rgba(57, 65, 72, 0.13),
        transparent 39%
      ),
      linear-gradient(
        180deg,
        #edf1f4 0%,
        #e1e7eb 68%,
        #cdd5da 68.3%,
        #b8c1c7 100%
      );
    box-shadow:
      0 28px 70px rgba(35, 44, 51, 0.25),
      inset 0 1px 0 rgba(255, 255, 255, 0.9);
  }

  .scene::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 30;
    pointer-events: none;
    background:
      linear-gradient(
        105deg,
        rgba(255, 255, 255, 0.2),
        transparent 28%,
        transparent 73%,
        rgba(22, 30, 36, 0.05)
      );
  }

  .floor-shadow {
    position: absolute;
    left: 25%;
    bottom: 8%;
    width: 50%;
    height: 10%;
    z-index: 0;
    border-radius: 50%;
    background: rgba(32, 40, 46, 0.2);
    filter: blur(15px);
  }

  .machine {
    position: absolute;
    left: 29%;
    top: 8%;
    width: 42%;
    height: 76%;
    z-index: 2;
  }

  .machine-body {
    position: absolute;
    inset: 0;
    z-index: 1;
    overflow: hidden;
    border: 1px solid rgba(67, 78, 86, 0.38);
    border-radius: 8% 8% 6% 6%;
    background:
      radial-gradient(
        circle at 22% 10%,
        rgba(255, 255, 255, 0.9),
        transparent 28%
      ),
      linear-gradient(
        108deg,
        #eef2f4 0%,
        #d8dde0 28%,
        #c4ccd1 69%,
        #aeb8bf 100%
      );
    box-shadow:
      0 19px 24px rgba(30, 39, 46, 0.26),
      0 5px 8px rgba(27, 35, 41, 0.18),
      inset 2px 2px 2px rgba(255, 255, 255, 0.9),
      inset -6px -7px 14px rgba(71, 83, 91, 0.14);
  }

  .machine-body::before {
    content: "";
    position: absolute;
    inset: 0 79% 0 0;
    background:
      linear-gradient(
        90deg,
        rgba(255, 255, 255, 0.52),
        rgba(255, 255, 255, 0.04)
      );
  }

  .machine-body::after {
    content: "";
    position: absolute;
    right: 0;
    top: 6%;
    width: 6%;
    height: 89%;
    border-radius: 0 60% 60% 0;
    background:
      linear-gradient(
        90deg,
        rgba(85, 98, 107, 0.04),
        rgba(49, 60, 68, 0.2)
      );
  }

  .upper-mask {
    position: absolute;
    left: 1px;
    right: 1px;
    top: 1px;
    height: 48.5%;
    z-index: 3;
    border-radius: 8% 8% 0 0;
    background:
      radial-gradient(
        circle at 22% 20%,
        rgba(255, 255, 255, 0.88),
        transparent 36%
      ),
      linear-gradient(
        108deg,
        #eef2f4 0%,
        #d8dde0 28%,
        #c4ccd1 69%,
        #aeb8bf 100%
      );
  }

  .top-ridge {
    position: absolute;
    left: 6%;
    right: 6%;
    top: 3%;
    height: 2.4%;
    z-index: 4;
    border-radius: 999px;
    background:
      linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.9),
        rgba(111, 124, 133, 0.17)
      );
  }

  .brand {
    position: absolute;
    left: 9%;
    top: 8%;
    z-index: 4;
    display: flex;
    align-items: center;
    gap: 6px;
    color: #66727a;
    font-size: clamp(7px, 1.2vw, 11px);
    font-weight: 800;
    letter-spacing: 0.13em;
  }

  .status-led {
    width: clamp(5px, 0.9vw, 8px);
    aspect-ratio: 1;
    border: 1px solid #246647;
    border-radius: 50%;
    background: #53e594;
    box-shadow:
      0 0 0 2px rgba(42, 72, 56, 0.14),
      0 0 7px rgba(74, 232, 142, 0.75);
    animation: ledPulse var(--cycle) linear infinite;
  }

  .display {
    position: absolute;
    left: 13%;
    top: 15%;
    width: 74%;
    height: 21%;
    z-index: 4;
    overflow: hidden;
    border: 3px solid #69747c;
    border-radius: 9%;
    color: #bdffe2;
    background:
      radial-gradient(
        circle at 25% 10%,
        rgba(120, 255, 194, 0.1),
        transparent 38%
      ),
      linear-gradient(145deg, #17211f, #07100e);
    box-shadow:
      inset 0 2px 7px rgba(0, 0, 0, 0.85),
      0 1px 0 rgba(255, 255, 255, 0.7);
  }

  .display::before {
    content: "";
    position: absolute;
    left: -10%;
    top: -65%;
    width: 115%;
    height: 100%;
    background:
      linear-gradient(
        125deg,
        rgba(255, 255, 255, 0.15),
        transparent 55%
      );
    transform: rotate(-5deg);
  }

  .display-label {
    position: absolute;
    left: 9%;
    top: 17%;
    color: rgba(190, 255, 224, 0.62);
    font-size: clamp(6px, 1.15vw, 10px);
    font-weight: 700;
    letter-spacing: 0.08em;
  }

  .display-number {
    position: absolute;
    left: 8%;
    bottom: 5%;
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    font-size: clamp(23px, 5.1vw, 46px);
    font-weight: 800;
    line-height: 1;
    letter-spacing: 0.02em;
    text-shadow: 0 0 9px rgba(100, 255, 185, 0.55);
  }

  .display-unit {
    position: absolute;
    left: 65%;
    bottom: 15%;
    font-size: clamp(7px, 1.4vw, 12px);
    font-weight: 800;
  }

  .instruction {
    position: absolute;
    left: 0;
    right: 0;
    top: 39%;
    z-index: 4;
    color: #55616a;
    text-align: center;
    font-size: clamp(7px, 1.3vw, 11px);
    font-weight: 800;
  }

  .slot {
    position: absolute;
    left: 23%;
    top: 45%;
    width: 54%;
    height: 5.8%;
    z-index: 5;
    overflow: hidden;
    border: 1px solid rgba(8, 12, 14, 0.9);
    border-radius: 999px;
    background:
      linear-gradient(
        180deg,
        #101519 0%,
        #020303 45%,
        #161c20 100%
      );
    box-shadow:
      inset 0 3px 5px #000,
      0 2px 0 rgba(255, 255, 255, 0.55),
      0 4px 6px rgba(28, 35, 40, 0.25);
  }

  .slot::before {
    content: "";
    position: absolute;
    left: 4%;
    right: 4%;
    top: 23%;
    height: 37%;
    border-radius: 999px;
    background:
      repeating-linear-gradient(
        90deg,
        #323a3e 0 5px,
        #0e1214 5px 8px
      );
    box-shadow:
      inset 0 1px 2px rgba(255, 255, 255, 0.14);
    animation: roller var(--cycle) linear infinite;
  }

  .slot::after {
    content: "";
    position: absolute;
    left: 6%;
    right: 6%;
    bottom: 5%;
    height: 17%;
    border-radius: 999px;
    background: rgba(0, 0, 0, 0.9);
  }

  .push-button {
    position: absolute;
    right: 8%;
    top: 61%;
    width: 18%;
    aspect-ratio: 1;
    z-index: 4;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background:
      linear-gradient(145deg, #747f86, #c8cfd3);
    box-shadow:
      4px 5px 8px rgba(42, 51, 57, 0.28),
      inset 1px 1px 2px rgba(255, 255, 255, 0.9);
  }

  .button-face {
    position: absolute;
    inset: 13%;
    display: grid;
    place-items: center;
    border: 1px solid #7a271d;
    border-radius: 50%;
    color: white;
    background:
      radial-gradient(
        circle at 36% 28%,
        #ff9584,
        #df4735 45%,
        #a6241b 100%
      );
    box-shadow:
      inset 3px 3px 5px rgba(255, 255, 255, 0.3),
      inset -4px -5px 6px rgba(80, 0, 0, 0.27),
      0 3px 4px rgba(33, 25, 24, 0.38);
    font-size: clamp(6px, 1.1vw, 10px);
    font-weight: 900;
    animation: buttonPress var(--cycle) ease-in-out infinite;
  }

  .push-label {
    position: absolute;
    top: 108%;
    color: #6a7378;
    font-size: clamp(5px, 0.9vw, 8px);
    font-weight: 900;
    letter-spacing: 0.13em;
  }

  .vent {
    position: absolute;
    left: 9%;
    bottom: 7%;
    width: 16%;
    height: 12%;
    z-index: 4;
    border-radius: 4px;
    opacity: 0.62;
    background:
      repeating-linear-gradient(
        180deg,
        #6d787f 0 2px,
        transparent 2px 5px
      );
  }

  .screw {
    position: absolute;
    z-index: 4;
    width: 2.2%;
    aspect-ratio: 1;
    border-radius: 50%;
    background:
      radial-gradient(circle at 34% 30%, #f8f8f8, #6d777d 75%);
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
  }

  .screw::after {
    content: "";
    position: absolute;
    left: 18%;
    top: 45%;
    width: 64%;
    height: 10%;
    background: rgba(50, 57, 62, 0.65);
    transform: rotate(-20deg);
  }

  .screw-1 {
    left: 5%;
    top: 5%;
  }

  .screw-2 {
    right: 5%;
    top: 5%;
  }

  .screw-3 {
    left: 5%;
    bottom: 5%;
  }

  .screw-4 {
    right: 5%;
    bottom: 5%;
  }

  .ticket-motion {
    position: absolute;
    left: 50%;
    top: 47.5%;
    width: 42%;
    height: 48%;
    z-index: 2;
    opacity: 0;
    transform-origin: 50% 0;
    animation: ticketOutput var(--cycle) linear infinite;
  }

  .ticket-paper {
    position: absolute;
    inset: 0;
    overflow: hidden;
    transform-origin: 50% 0;
    color: #242627;
    background:
      repeating-linear-gradient(
        0deg,
        rgba(67, 63, 48, 0.018) 0 1px,
        transparent 1px 4px
      ),
      linear-gradient(
        100deg,
        #e9e5d6 0%,
        #fffef7 22%,
        #f8f5e9 77%,
        #ddd8c9 100%
      );
    filter:
      drop-shadow(0 9px 7px rgba(34, 39, 42, 0.3))
      drop-shadow(0 2px 1px rgba(0, 0, 0, 0.2));
    animation: paperFlex var(--cycle) ease-in-out infinite;

    -webkit-mask:
      radial-gradient(
        circle at 4px 0,
        transparent 3px,
        #000 3.4px
      ) 0 0 / 8px 100%;

    mask:
      radial-gradient(
        circle at 4px 0,
        transparent 3px,
        #000 3.4px
      ) 0 0 / 8px 100%;
  }

  .ticket-paper::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 12%;
    background:
      linear-gradient(
        180deg,
        rgba(97, 91, 72, 0.18),
        transparent
      );
  }

  .ticket-paper::after {
    content: "";
    position: absolute;
    left: -50%;
    top: -20%;
    width: 55%;
    height: 140%;
    background:
      linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.52),
        transparent
      );
    transform: rotate(10deg);
    animation: paperGlint var(--cycle) ease-in-out infinite;
  }

  .ticket-content {
    position: absolute;
    inset: 8% 9% 6%;
    text-align: center;
  }

  .ticket-title {
    color: #51504a;
    font-size: clamp(5px, 0.9vw, 8px);
    font-weight: 900;
    letter-spacing: 0.11em;
  }

  .ticket-number {
    margin-top: 7%;
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    font-size: clamp(25px, 5.7vw, 51px);
    font-weight: 900;
    line-height: 1;
    letter-spacing: -0.07em;
  }

  .ticket-line {
    width: 78%;
    height: 1px;
    margin: 7% auto 6%;
    background:
      repeating-linear-gradient(
        90deg,
        #777 0 4px,
        transparent 4px 7px
      );
  }

  .ticket-current {
    color: #5d5a53;
    font-size: clamp(5px, 1vw, 9px);
    font-weight: 700;
  }

  .ticket-current strong {
    color: #242424;
    font-size: 1.2em;
  }

  .barcode {
    width: 74%;
    height: 15%;
    margin: 9% auto 4%;
    opacity: 0.74;
    background:
      repeating-linear-gradient(
        90deg,
        #111 0 1px,
        transparent 1px 3px,
        #111 3px 5px,
        transparent 5px 7px,
        #111 7px 8px,
        transparent 8px 11px
      );
  }

  .ticket-date {
    color: #77736a;
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    font-size: clamp(4px, 0.75vw, 7px);
  }

  @keyframes ticketOutput {
    0%,
    9% {
      opacity: 0;
      transform: translate(-50%, -99%) rotate(0deg);
    }

    10% {
      opacity: 1;
      transform: translate(-50%, -99%) rotate(0deg);
    }

    20% {
      transform: translate(-50%, -78%) rotate(-0.3deg);
    }

    24% {
      transform: translate(-50%, -81%) rotate(0.2deg);
    }

    36% {
      transform: translate(-50%, -55%) rotate(-0.2deg);
    }

    40% {
      transform: translate(-50%, -58%) rotate(0.15deg);
    }

    52% {
      transform: translate(-50%, -29%) rotate(-0.1deg);
    }

    56% {
      transform: translate(-50%, -32%) rotate(0.1deg);
    }

    68%,
    94% {
      opacity: 1;
      transform: translate(-50%, 0%) rotate(0deg);
    }

    100% {
      opacity: 0;
      transform: translate(-50%, 0%) rotate(0deg);
    }
  }

  @keyframes paperFlex {
    0%,
    10% {
      transform:
        perspective(500px)
        rotateX(-15deg)
        skewX(-0.7deg);
    }

    25% {
      transform:
        perspective(500px)
        rotateX(4deg)
        skewX(0.4deg);
    }

    42% {
      transform:
        perspective(500px)
        rotateX(-3deg)
        skewX(-0.2deg);
    }

    58% {
      transform:
        perspective(500px)
        rotateX(2deg)
        skewX(0.1deg);
    }

    68%,
    100% {
      transform:
        perspective(500px)
        rotateX(0deg)
        rotateY(0deg)
        skewX(0deg);
    }
  }

  @keyframes buttonPress {
    0%,
    3%,
    12%,
    100% {
      transform: translateY(0) scale(1);
      filter: brightness(1);
    }

    6% {
      transform: translateY(3px) scale(0.91);
      filter: brightness(0.82);
      box-shadow:
        inset 4px 5px 7px rgba(85, 0, 0, 0.4),
        0 1px 2px rgba(33, 25, 24, 0.2);
    }
  }

  @keyframes roller {
    0%,
    9% {
      background-position-x: 0;
    }

    68% {
      background-position-x: 100px;
    }

    69%,
    100% {
      background-position-x: 100px;
    }
  }

  @keyframes ledPulse {
    0%,
    8%,
    70%,
    100% {
      filter: brightness(1);
    }

    14%,
    26%,
    38%,
    50%,
    62% {
      filter: brightness(1.8);
    }

    20%,
    32%,
    44%,
    56% {
      filter: brightness(0.75);
    }
  }

  @keyframes paperGlint {
    0%,
    20% {
      transform: translateX(0) rotate(10deg);
    }

    68%,
    100% {
      transform: translateX(310%) rotate(10deg);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
      animation: none !important;
    }

    .ticket-motion {
      opacity: 1;
      transform: translate(-50%, 0);
    }
  }
</style>
</head>

<body>
  <div class="machine">
    <div class="machine-body"></div>

    <div class="ticket-motion">
      <div class="ticket-paper">
        <div class="ticket-content">
          <div class="ticket-title">WAITING TICKET</div>

          <div class="ticket-number">127</div>

          <div class="ticket-line"></div>

          <div class="ticket-current">
            현재 호출 번호 <strong>119</strong>
          </div>

          <div class="barcode"></div>

          <div class="ticket-date">
            2026.06.21&nbsp;&nbsp;14:32
          </div>
        </div>
      </div>
    </div>

    <div class="upper-mask"></div>
    <div class="top-ridge"></div>

    <div class="brand">
      <span class="status-led"></span>
      SMART QUEUE
    </div>

    <div class="display">
      <span class="display-label">대기 인원</span>
      <strong class="display-number">12</strong>
      <span class="display-unit">명</span>
    </div>

    <div class="instruction">번호표를 발급합니다</div>

    <div class="slot"></div>

    <div class="push-button">
      <span class="button-face">발권</span>
      <span class="push-label">PUSH</span>
    </div>

    <div class="vent"></div>

    <i class="screw screw-1"></i>
    <i class="screw screw-2"></i>
    <i class="screw screw-3"></i>
    <i class="screw screw-4"></i>
  </div>
</body>
</html>
