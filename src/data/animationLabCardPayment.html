<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>구버전 카드애니메이션</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 20% 20%, rgba(125, 166, 139, 0.18), transparent 28%),
        radial-gradient(circle at 82% 26%, rgba(255, 255, 255, 0.22), transparent 24%),
        linear-gradient(180deg, #dfe9df 0%, #c9d8cb 100%);
      font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      color: #244335;
    }

    .confirm-modal {
      width: min(440px, 90vw);
      padding: 22px 20px 18px;
      border-radius: 24px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.82), rgba(249, 252, 249, 0.96)),
        #f7fbf7;
      border: 1px solid rgba(116, 152, 126, 0.22);
      box-shadow:
        0 24px 60px rgba(46, 77, 57, 0.18),
        inset 0 1px 0 rgba(255, 255, 255, 0.8);
      text-align: center;
    }

    .confirm-modal__title {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.04em;
      color: #224635;
    }

    .confirm-modal__desc {
      margin-top: 10px;
      color: rgba(36, 67, 53, 0.7);
      font-size: 15px;
      line-height: 1.6;
    }

    .shop-terminal-stage {
      margin-top: 14px;
      position: relative;
      border: 1px solid rgba(40, 84, 63, 0.15);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.62);
      padding: 16px 14px 18px;
      overflow: hidden;
    }

    .shop-terminal-device {
      width: min(300px, 100%);
      margin: 34px auto 10px;
      position: relative;
      z-index: 2;
      border-radius: 14px;
      border: 1px solid rgba(27, 52, 42, 0.28);
      background: linear-gradient(165deg, #2d4e42, #1f3a31);
      padding: 12px;
      box-shadow: 0 10px 22px rgba(18, 29, 24, 0.28);
    }

    .shop-terminal-screen {
      border-radius: 10px;
      border: 1px solid rgba(160, 234, 196, 0.28);
      background: linear-gradient(165deg, #0f2a22, #133328);
      color: #cbf7df;
      padding: 10px 12px;
      min-height: 82px;
      position: relative;
      overflow: hidden;
    }

    .shop-terminal-screen__state {
      position: absolute;
      inset: 10px 12px;
      display: grid;
      align-content: center;
      justify-items: center;
      opacity: 0;
    }

    .shop-terminal-screen__state--processing { animation: terminalScreenProcessing 1.5s ease-out forwards; }
    .shop-terminal-screen__state--done { animation: terminalScreenDone 0.55s ease-out 1.45s forwards; }

    .shop-terminal-screen__label {
      font-size: 0.76rem;
      opacity: 0.86;
    }

    .shop-terminal-screen__amount {
      margin-top: 4px;
      font-size: 1.04rem;
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    .shop-terminal-slot {
      margin: 10px auto 0;
      width: 78%;
      height: 8px;
      border-radius: 999px;
      background: rgba(6, 17, 13, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.16);
    }

    .shop-terminal-card-swipe {
      position: absolute;
      left: 50%;
      top: -4px;
      width: min(210px, 80%);
      transform: translateX(-50%);
      animation: shopTerminalSwipe 1350ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
      z-index: 1;
    }

    .shop-terminal-card-swipe .sim-card {
      width: 100%;
      aspect-ratio: 1.56 / 1;
      box-shadow: 0 6px 14px rgba(24, 35, 30, 0.2);
    }

    .meter__hint {
      margin-top: 8px;
      text-align: center;
      color: rgba(36, 67, 53, 0.72);
      font-size: 14px;
      line-height: 1.5;
      min-height: 22px;
      position: relative;
    }

    .meter__hint span {
      position: absolute;
      left: 0;
      right: 0;
      opacity: 0;
    }

    .meter__hint--processing { animation: terminalHintProcessing 1.5s ease-out forwards; }
    .meter__hint--done { animation: terminalHintDone 0.55s ease-out 1.45s forwards; }

    .sim-card {
      width: 100%;
      aspect-ratio: 1.56 / 1;
      border-radius: 10px;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.28);
      background: linear-gradient(145deg, var(--sim-bg1, #e8eee8), var(--sim-bg2, #c8d9c9));
      color: #f6fffa;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.2);
      text-align: left;
    }

    .sim-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        var(--sim-overlay, linear-gradient(160deg, rgba(255, 255, 255, 0.22), rgba(255, 255, 255, 0) 42%)),
        repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.05) 0 1px, rgba(255, 255, 255, 0) 1px 3px);
      pointer-events: none;
    }

    .sim-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: var(--sim-deco, none);
      pointer-events: none;
    }

    .sim-card__chip {
      position: absolute;
      top: 10%;
      right: 10%;
      width: 18%;
      aspect-ratio: 1.45 / 1;
      border-radius: 4px;
      background: linear-gradient(145deg, #f5d789, #d6ad54);
      border: 1px solid rgba(81, 60, 20, 0.35);
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.32), inset 0 -1px 2px rgba(68, 48, 15, 0.2);
    }

    .sim-card__brand {
      position: absolute;
      top: 10%;
      left: 10%;
      font-size: 0.66rem;
      font-weight: 700;
      opacity: 0.9;
      z-index: 2;
    }

    .sim-card__number {
      position: absolute;
      left: 10%;
      right: 10%;
      top: 46%;
      transform: translateY(-50%);
      font-size: clamp(0.72rem, 1.7vw, 1rem);
      font-weight: 700;
      letter-spacing: 0.06em;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
      text-align: left;
    }

    .sim-card__holder {
      position: absolute;
      left: 10%;
      bottom: 12%;
      font-size: 0.56rem;
      letter-spacing: 0.08em;
      opacity: 0.9;
      z-index: 2;
    }

    .sim-card__tag {
      position: absolute;
      right: 10%;
      bottom: 12%;
      font-size: 0.56rem;
      font-weight: 800;
      letter-spacing: 0.06em;
    }

    .sim-card--credit.sim-card--v4 {
      --sim-bg1: #ba3d56;
      --sim-bg2: #7a2536;
      --sim-deco: repeating-linear-gradient(30deg, rgba(255,255,255,0.14) 0 2px, rgba(255,255,255,0) 2px 8px);
    }

    @keyframes shopTerminalSwipe {
      0% { opacity: 0.15; transform: translateX(calc(-50% - 190px)) translateY(0) rotate(-2deg) scale(0.98); }
      15% { opacity: 0.95; transform: translateX(calc(-50% - 120px)) translateY(0) rotate(-1.2deg) scale(1); }
      62% { opacity: 0.95; transform: translateX(calc(-50% + 120px)) translateY(0) rotate(1deg) scale(1); }
      100% { opacity: 0; transform: translateX(calc(-50% + 210px)) translateY(0) rotate(2deg) scale(0.985); }
    }

    @keyframes terminalScreenProcessing {
      0%, 72% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-6px); }
    }

    @keyframes terminalScreenDone {
      0% { opacity: 0; transform: translateY(8px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes terminalHintProcessing {
      0%, 72% { opacity: 1; }
      100% { opacity: 0; }
    }

    @keyframes terminalHintDone {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="confirm-modal shop-terminal-modal">
    <div class="confirm-modal__title">카드 결제중</div>
    <div class="confirm-modal__desc">카드를 단말기에 그어 결제하는 중입니다.</div>
    <div class="shop-terminal-stage">
      <div class="shop-terminal-device">
        <div class="shop-terminal-screen">
          <div class="shop-terminal-screen__state shop-terminal-screen__state--processing">
            <div class="shop-terminal-screen__label">결제금액</div>
            <div class="shop-terminal-screen__amount">₩184,000</div>
          </div>
          <div class="shop-terminal-screen__state shop-terminal-screen__state--done">
            <div class="shop-terminal-screen__label">결제 상태</div>
            <div class="shop-terminal-screen__amount">결제완료!</div>
          </div>
        </div>
        <div class="shop-terminal-slot"></div>
      </div>
      <div class="shop-terminal-card-swipe">
        <div class="sim-card sim-card--credit sim-card--v4">
          <div class="sim-card__chip"></div>
          <div class="sim-card__brand">NH PAY</div>
          <div class="sim-card__number">5412 27•• •••• 6018</div>
          <div class="sim-card__holder">CARDHOLDER NAME</div>
          <div class="sim-card__tag">CREDIT</div>
        </div>
      </div>
    </div>
    <div class="meter__hint">
      <span class="meter__hint--processing">카드 결제중...</span>
      <span class="meter__hint--done">영수증 출력 중...</span>
    </div>
  </div>
</body>
</html>
