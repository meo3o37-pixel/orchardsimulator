<!DOCTYPE html>
<html lang="ko"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>카드 결제 애니메이션</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --duration: 3.25s;
      --green-900: #18362a;
      --green-800: #224635;
      --green-700: #2f5a45;
      --green-500: #5c9872;
      --green-300: #bde8ce;
      --cream: #f7fbf7;
      --gold: #f7d56b;
      --card-1: #c44762;
      --card-2: #762135;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 18% 18%, rgba(34, 197, 94, 0.22), transparent 28%),
        radial-gradient(circle at 84% 22%, rgba(250, 204, 21, 0.2), transparent 25%),
        radial-gradient(circle at 50% 92%, rgba(59, 130, 246, 0.16), transparent 34%),
        linear-gradient(135deg, #dfece3 0%, #c5d9cb 52%, #aebfb4 100%);
      font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      color: #244335;
    }

    .confirm-modal {
      width: min(460px, 92vw);
      padding: 24px 20px 20px;
      border-radius: 28px;
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.9), rgba(249, 252, 249, 0.98)),
        #f7fbf7;
      border: 1px solid rgba(116, 152, 126, 0.24);
      box-shadow:
        0 28px 70px rgba(46, 77, 57, 0.22),
        inset 0 1px 0 rgba(255, 255, 255, 0.88);
      text-align: center;
      animation: modalEnter 520ms cubic-bezier(0.2, 1, 0.2, 1) both;
    }

    .confirm-modal::before {
      content: "";
      position: absolute;
      inset: -55%;
      background: conic-gradient(
        from 140deg,
        transparent,
        rgba(92, 152, 114, 0.12),
        transparent,
        rgba(247, 213, 107, 0.14),
        transparent
      );
      animation: modalGlowSpin 7s linear infinite;
      pointer-events: none;
    }

    .confirm-modal > * {
      position: relative;
      z-index: 1;
    }

    .confirm-modal__title {
      font-size: 29px;
      font-weight: 900;
      letter-spacing: -0.055em;
      color: #224635;
    }

    .confirm-modal__desc {
      margin-top: 9px;
      color: rgba(36, 67, 53, 0.68);
      font-size: 15px;
      line-height: 1.6;
    }

    .shop-terminal-stage {
      margin-top: 16px;
      min-height: 372px;
      position: relative;
      border: 1px solid rgba(40, 84, 63, 0.2);
      border-radius: 20px;
      background:
        radial-gradient(circle at 22% 24%, rgba(250, 204, 21, 0.22), transparent 24%),
        radial-gradient(circle at 78% 25%, rgba(34, 197, 94, 0.28), transparent 28%),
        radial-gradient(circle at 50% 88%, rgba(59, 130, 246, 0.18), transparent 32%),
        linear-gradient(135deg, rgba(16, 31, 28, 0.9), rgba(22, 55, 42, 0.82) 52%, rgba(8, 20, 25, 0.9));
      padding: 18px 14px 20px;
      overflow: hidden;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.22),
        0 18px 36px rgba(21, 55, 39, 0.2);
    }

    .shop-terminal-stage::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      background-image:
        linear-gradient(rgba(220, 252, 231, 0.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(220, 252, 231, 0.07) 1px, transparent 1px);
      background-size: 22px 22px;
      mask-image: radial-gradient(circle at center, black, transparent 78%);
      pointer-events: none;
    }

    .shop-terminal-stage::after {
      content: "";
      position: absolute;
      inset: -42%;
      z-index: 0;
      background:
        conic-gradient(
          from 215deg,
          transparent,
          rgba(250, 204, 21, 0.2),
          transparent 28%,
          rgba(34, 197, 94, 0.22),
          transparent 58%,
          rgba(96, 165, 250, 0.16),
          transparent
        );
      opacity: 0.9;
      filter: blur(2px);
      animation: modalGlowSpin 8s linear infinite;
      pointer-events: none;
    }

    .shop-terminal-device {
      width: min(348px, 100%);
      margin: 38px auto 0;
      position: relative;
      z-index: 10;
      overflow: visible;
      border-radius: 22px 22px 18px 18px;
      border: 1px solid rgba(27, 52, 42, 0.32);
      background:
        linear-gradient(145deg, rgba(255, 255, 255, 0.1), transparent 32%),
        linear-gradient(165deg, #315748, #1e392f 58%, #152c25);
      padding: 20px 14px 18px;
      box-shadow:
        0 18px 35px rgba(18, 29, 24, 0.32),
        0 12px 0 rgba(23, 44, 36, 0.12),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
      animation: terminalBump var(--duration) ease-in-out forwards;
    }

    .shop-terminal-device::before {
      content: "";
      position: absolute;
      inset: 9px;
      z-index: 0;
      border-radius: 17px 17px 14px 14px;
      border: 1px solid rgba(220, 252, 231, 0.08);
      pointer-events: none;
    }

    .shop-terminal-device::after {
      content: "";
      position: absolute;
      left: 22px;
      right: 22px;
      bottom: -7px;
      height: 9px;
      z-index: -1;
      border-radius: 0 0 18px 18px;
      background: rgba(8, 20, 16, 0.22);
      filter: blur(1px);
      pointer-events: none;
    }

    .terminal-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 9px;
      padding: 0 3px;
      color: rgba(220, 252, 231, 0.8);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.08em;
      position: relative;
      z-index: 25;
    }

    .terminal-led {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #facc15;
      box-shadow: 0 0 0 4px rgba(250, 204, 21, 0.14);
      animation: ledBlink var(--duration) ease-in-out forwards;
    }

    .shop-terminal-screen {
      min-height: 100px;
      position: relative;
      z-index: 25;
      overflow: hidden;
      border-radius: 14px;
      border: 1px solid rgba(160, 234, 196, 0.28);
      background:
        radial-gradient(circle at 50% 0%, rgba(98, 236, 156, 0.14), transparent 55%),
        linear-gradient(165deg, #0b231c, #123328);
      color: #cbf7df;
      padding: 10px 12px;
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.04),
        inset 0 -18px 26px rgba(0, 0, 0, 0.18);
    }

    .shop-terminal-screen::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.12), transparent),
        repeating-linear-gradient(
          180deg,
          rgba(255,255,255,0.035) 0 1px,
          transparent 1px 4px
        );
      transform: translateX(-120%);
      animation: screenScan var(--duration) ease-in-out forwards;
      pointer-events: none;
    }

    .shop-terminal-screen__state {
      position: absolute;
      inset: 10px 12px;
      z-index: 2;
      display: grid;
      align-content: center;
      justify-items: center;
      opacity: 0;
      transform: translateY(4px);
    }

    .shop-terminal-screen__meta {
      position: absolute;
      inset: 9px 12px;
      z-index: 1;
      display: flex;
      justify-content: space-between;
      color: rgba(203, 247, 223, 0.52);
      font-size: 8px;
      font-weight: 900;
      letter-spacing: 0.08em;
      pointer-events: none;
    }

    .shop-terminal-screen__meta span:first-child {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .shop-terminal-screen__meta span:first-child::before {
      content: "";
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #86efac;
      box-shadow: 0 0 8px rgba(134, 239, 172, 0.48);
    }

    .shop-terminal-screen__lines {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: 9px;
      z-index: 1;
      display: grid;
      gap: 4px;
      opacity: 0.34;
      pointer-events: none;
    }

    .shop-terminal-screen__lines span {
      height: 2px;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(203,247,223,0.58), transparent 74%);
    }

    .shop-terminal-screen__lines span:nth-child(2) {
      width: 64%;
    }

    .shop-terminal-screen__state--processing {
      animation: screenProcessing var(--duration) ease-in-out forwards;
    }

    .shop-terminal-screen__state--auth {
      animation: screenAuth var(--duration) ease-in-out forwards;
    }

    .shop-terminal-screen__state--done {
      animation: screenDone var(--duration) ease-in-out forwards;
    }

    .shop-terminal-screen__label {
      font-size: 0.76rem;
      opacity: 0.86;
    }

    .shop-terminal-screen__amount {
      margin-top: 4px;
      font-size: 1.08rem;
      font-weight: 900;
      letter-spacing: 0.01em;
    }

    .screen-loader {
      width: 112px;
      height: 6px;
      margin-top: 11px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(203, 247, 223, 0.16);
    }

    .screen-loader::before {
      content: "";
      display: block;
      height: 100%;
      width: 42%;
      border-radius: inherit;
      background: linear-gradient(90deg, #86efac, #facc15);
      animation: loaderMove 900ms ease-in-out infinite;
    }

    .signal-dots {
      display: flex;
      gap: 6px;
      margin-top: 12px;
    }

    .signal-dots span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #86efac;
      box-shadow: 0 0 12px rgba(134, 239, 172, 0.55);
      animation: dotPulse 640ms ease-in-out infinite;
    }

    .signal-dots span:nth-child(2) {
      animation-delay: 110ms;
    }

    .signal-dots span:nth-child(3) {
      animation-delay: 220ms;
    }

    .screen-check {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      position: relative;
      margin-bottom: 5px;
      background: #86efac;
      box-shadow:
        0 0 0 7px rgba(134, 239, 172, 0.13),
        0 0 28px rgba(134, 239, 172, 0.34);
    }

    .screen-check::before {
      content: "";
      position: absolute;
      left: 9px;
      top: 9px;
      width: 13px;
      height: 7px;
      border-left: 4px solid #0f2a22;
      border-bottom: 4px solid #0f2a22;
      transform: rotate(-45deg);
    }

    .shop-terminal-slot {
      margin: 12px auto 0;
      width: 81%;
      height: 10px;
      border-radius: 999px;
      position: relative;
      z-index: 35;
      overflow: hidden;
      background: rgba(6, 17, 13, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.17);
      box-shadow:
        inset 0 2px 6px rgba(0, 0, 0, 0.56),
        0 0 0 rgba(134, 239, 172, 0);
      animation: slotGlow var(--duration) ease-in-out forwards;
    }

    .shop-terminal-slot::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      width: 42%;
      left: -44%;
      border-radius: inherit;
      background: linear-gradient(90deg, transparent, #86efac, transparent);
      animation: slotSweep var(--duration) ease-in-out forwards;
    }

    .shop-terminal-slot::after {
      content: "";
      position: absolute;
      inset: 3px 18px;
      border-radius: inherit;
      background: rgba(255,255,255,0.08);
      pointer-events: none;
    }

    .shop-terminal-slot-label {
      margin: 7px auto -2px;
      color: rgba(220, 252, 231, 0.48);
      font-size: 8px;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-align: center;
      pointer-events: none;
    }

    .receipt {
      position: absolute;
      left: 50%;
      top: 181px;
      width: 132px;
      height: 126px;
      z-index: 30;
      opacity: 0;
      transform-origin: top center;
      transform: translateX(-50%) translateY(-14px) scaleY(0.04);
      border-radius: 0 0 15px 15px;
      background:
        repeating-linear-gradient(
          180deg,
          transparent 0 13px,
          rgba(24, 54, 42, 0.08) 13px 15px
        ),
        linear-gradient(180deg, #ffffff, #eef3ee);
      box-shadow:
        0 18px 28px rgba(18, 29, 24, 0.24),
        inset 0 1px 0 rgba(255,255,255,0.9);
      animation: receiptFromCenterSlot var(--duration) ease-in-out forwards;
    }

    .receipt::before {
      content: "";
      position: absolute;
      left: 18px;
      right: 18px;
      top: 18px;
      height: 52px;
      background:
        linear-gradient(#244335 0 0) 0 0 / 100% 3px no-repeat,
        linear-gradient(#244335 0 0) 0 13px / 82% 3px no-repeat,
        linear-gradient(#244335 0 0) 0 26px / 94% 3px no-repeat,
        linear-gradient(#244335 0 0) 0 39px / 62% 3px no-repeat;
      opacity: 0.16;
    }

    .receipt::after {
      content: "PAID";
      position: absolute;
      left: 50%;
      top: 86px;
      transform: translate(-50%, -50%) rotate(-10deg) scale(1.35);
      padding: 5px 9px;
      border-radius: 7px;
      border: 3px solid #4f9a68;
      color: #3f8759;
      font-size: 18px;
      font-weight: 950;
      letter-spacing: 0.03em;
      opacity: 0;
      animation: paidStamp var(--duration) ease-in-out forwards;
    }

    .shop-terminal-card-swipe {
      position: absolute;
      left: 0;
      right: 0;
      top: 6px;
      display: flex;
      justify-content: center;
      z-index: 8;
      transform-origin: center;
      will-change: transform, opacity;
      transform: translate3d(0, 0, 0);
      backface-visibility: hidden;
      animation: cardSwipeArc var(--duration) cubic-bezier(0.2, 1, 0.25, 1) forwards;
      pointer-events: none;
    }

    .shop-terminal-card-swipe::before {
      content: "";
      position: absolute;
      left: -36px;
      right: -36px;
      top: 50%;
      height: 26px;
      border-radius: 999px;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.62),
        rgba(134, 239, 172, 0.44),
        transparent
      );
      transform: translateY(-50%) scaleX(0.5);
      opacity: 0;
      filter: blur(9px);
      z-index: -1;
      animation: cardTrail var(--duration) ease-in-out forwards;
    }

    .sim-card {
      width: min(206px, 82%);
      aspect-ratio: 1.56 / 1;
      border-radius: 13px;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: linear-gradient(145deg, var(--card-1), var(--card-2));
      color: #f6fffa;
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.2),
        0 8px 18px rgba(24, 35, 30, 0.16),
        0 18px 20px rgba(24, 35, 30, 0.18);
      text-align: left;
      will-change: transform;
      backface-visibility: hidden;
    }

    .sim-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(160deg, rgba(255, 255, 255, 0.22), rgba(255, 255, 255, 0) 42%),
        repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.055) 0 1px, transparent 1px 3px);
      pointer-events: none;
    }

    .sim-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 18% 18%, rgba(255,255,255,0.16), transparent 28%),
        repeating-linear-gradient(30deg, rgba(255,255,255,0.14) 0 2px, transparent 2px 8px);
      pointer-events: none;
    }

    .sim-card__stripe {
      position: absolute;
      left: 0;
      right: 0;
      top: 46%;
      height: 18%;
      background:
        linear-gradient(
          90deg,
          rgba(255,255,255,0.08),
          transparent 24%,
          transparent 76%,
          rgba(255,255,255,0.08)
        ),
        rgba(18, 24, 22, 0.52);
      z-index: 1;
    }

    .sim-card__chip {
      position: absolute;
      top: 12%;
      right: 10%;
      width: 18%;
      aspect-ratio: 1.45 / 1;
      border-radius: 5px;
      background:
        linear-gradient(90deg, transparent 48%, rgba(99, 71, 22, 0.28) 49% 51%, transparent 52%),
        linear-gradient(180deg, transparent 47%, rgba(99, 71, 22, 0.28) 48% 52%, transparent 53%),
        linear-gradient(145deg, #f7df92, #d4a849);
      border: 1px solid rgba(81, 60, 20, 0.35);
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.34),
        inset 0 -1px 2px rgba(68, 48, 15, 0.18);
      z-index: 2;
    }

    .sim-card__brand {
      position: absolute;
      top: 12%;
      left: 10%;
      font-size: 0.68rem;
      font-weight: 900;
      opacity: 0.94;
      z-index: 2;
      letter-spacing: 0.02em;
    }

    .sim-card__number {
      position: absolute;
      left: 10%;
      right: 10%;
      top: 48%;
      transform: translateY(-50%);
      font-size: clamp(0.76rem, 1.8vw, 1.02rem);
      font-weight: 800;
      letter-spacing: 0.06em;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
      text-align: left;
      z-index: 3;
    }

    .sim-card__holder {
      position: absolute;
      left: 10%;
      bottom: 12%;
      font-size: 0.56rem;
      letter-spacing: 0.08em;
      opacity: 0.9;
      z-index: 2;
    }

    .sim-card__tag {
      position: absolute;
      right: 10%;
      bottom: 12%;
      font-size: 0.56rem;
      font-weight: 900;
      letter-spacing: 0.06em;
      z-index: 2;
    }

    .terminal-body-row {
      display: grid;
      grid-template-columns: 1fr 70px;
      gap: 12px;
      align-items: center;
      margin-top: 13px;
      position: relative;
      z-index: 18;
    }

    .terminal-input-stack {
      display: grid;
      gap: 9px;
    }

    .terminal-keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
    }

    .terminal-keypad span {
      height: 13px;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.17);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.16),
        0 1px 0 rgba(0, 0, 0, 0.14);
      animation: keypadTap var(--duration) ease-in-out forwards;
    }

    .terminal-keypad span:nth-child(3n + 1) {
      animation-delay: 80ms;
    }

    .terminal-keypad span:nth-child(3n + 2) {
      animation-delay: 140ms;
    }

    .terminal-keypad span:nth-child(3n + 3) {
      animation-delay: 200ms;
    }

    .terminal-function-row {
      width: 100%;
      margin: 0;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
      position: relative;
      z-index: 18;
    }

    .terminal-function-row span {
      height: 12px;
      border-radius: 999px;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.18),
        0 1px 0 rgba(0,0,0,0.16);
    }

    .terminal-function-row span:nth-child(1) {
      background: rgba(239, 68, 68, 0.68);
    }

    .terminal-function-row span:nth-child(2) {
      background: rgba(250, 204, 21, 0.68);
    }

    .terminal-function-row span:nth-child(3) {
      background: rgba(34, 197, 94, 0.72);
      animation: approvePulse var(--duration) ease-in-out forwards;
    }

    .contactless-mark {
      width: 58px;
      height: 50px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 26% 22%, rgba(255, 255, 255, 0.12), transparent 32%),
        linear-gradient(145deg, rgba(73, 111, 91, 0.64), rgba(31, 60, 49, 0.92));
      border: 1px solid rgba(196, 230, 210, 0.2);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.12),
        inset 0 -10px 18px rgba(4, 19, 13, 0.2),
        0 8px 16px rgba(9, 25, 18, 0.18);
    }

    .contactless-mark::before {
      content: "";
      position: absolute;
      inset: 8px;
      border-radius: 12px;
      border: 1px solid rgba(219, 255, 235, 0.09);
      pointer-events: none;
    }

    .contactless-icon {
      width: 34px;
      height: 32px;
      position: relative;
      animation: contactPulse var(--duration) ease-in-out forwards;
    }

    .contactless-icon__dot {
      position: absolute;
      left: 6px;
      top: 50%;
      width: 5px;
      height: 5px;
      border-radius: 999px;
      background: rgba(203, 247, 223, 0.82);
      transform: translateY(-50%);
      box-shadow: 0 0 8px rgba(134, 239, 172, 0.32);
    }

    .contactless-icon__wave {
      content: "";
      position: absolute;
      top: 50%;
      left: 3px;
      border-radius: 50%;
      border-right: 3px solid rgba(203, 247, 223, 0.66);
      border-top: 3px solid transparent;
      border-bottom: 3px solid transparent;
      transform: translateY(-50%);
    }

    .contactless-icon__wave--sm {
      width: 13px;
      height: 15px;
    }

    .contactless-icon__wave--md {
      width: 21px;
      height: 24px;
      opacity: 0.82;
    }

    .contactless-icon__wave--lg {
      width: 29px;
      height: 32px;
      opacity: 0.58;
    }

    .pay-spark {
      position: absolute;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #f7d56b;
      box-shadow: 0 0 18px rgba(247, 213, 107, 0.65);
      opacity: 0;
      z-index: 45;
      animation: sparkPop var(--duration) ease-out forwards;
    }

    .pay-spark:nth-of-type(1) {
      left: 16%;
      top: 42%;
    }

    .pay-spark:nth-of-type(2) {
      left: 26%;
      top: 29%;
      animation-delay: 80ms;
    }

    .pay-spark:nth-of-type(3) {
      left: 48%;
      top: 38%;
      animation-delay: 160ms;
    }

    .pay-spark:nth-of-type(4) {
      left: 67%;
      top: 30%;
      animation-delay: 240ms;
    }

    .pay-spark:nth-of-type(5) {
      left: 78%;
      top: 45%;
      animation-delay: 320ms;
    }

    .meter__hint {
      margin-top: 11px;
      text-align: center;
      color: rgba(36, 67, 53, 0.72);
      font-size: 14px;
      line-height: 1.5;
      min-height: 22px;
      position: relative;
      font-weight: 650;
    }

    .meter__hint span {
      position: absolute;
      left: 0;
      right: 0;
      opacity: 0;
      transform: translateY(5px);
    }

    .meter__hint--processing {
      animation: hintProcessing var(--duration) ease-in-out forwards;
    }

    .meter__hint--auth {
      animation: hintAuth var(--duration) ease-in-out forwards;
    }

    .meter__hint--done {
      animation: hintDone var(--duration) ease-in-out forwards;
    }

    @keyframes modalEnter {
      0% {
        opacity: 0;
        transform: translateY(14px) scale(0.975);
      }

      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes modalGlowSpin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes terminalBump {
      0%, 58%, 100% {
        transform: translateY(0) scale(1);
      }

      74% {
        transform: translateY(-4px) scale(1.018);
      }

      86% {
        transform: translateY(0) scale(1);
      }
    }

    @keyframes ledBlink {
      0%, 42% {
        background: #facc15;
        box-shadow: 0 0 0 4px rgba(250, 204, 21, 0.14);
      }

      55%, 68% {

        box-shadow:
          0 0 0 4px rgba(96, 165, 250, 0.14),
          0 0 18px rgba(96, 165, 250, 0.45);
      }

      82%, 100% {

        box-shadow:
          0 0 0 4px rgba(134, 239, 172, 0.16),
          0 0 20px rgba(134, 239, 172, 0.55);
      }
    }

    @keyframes screenScan {
      0%, 8% {
        transform: translateX(-120%);
      }

      44%, 78% {
        transform: translateX(120%);
      }

      100% {
        transform: translateX(120%);
      }
    }

    @keyframes screenProcessing {
      0%, 43% {
        opacity: 1;
        transform: translateY(0);
      }

      52%, 100% {
        opacity: 0;
        transform: translateY(-7px);
      }
    }

    @keyframes screenAuth {
      0%, 43% {
        opacity: 0;
        transform: translateY(7px);
      }

      53%, 68% {
        opacity: 1;
        transform: translateY(0);
      }

      78%, 100% {
        opacity: 0;
        transform: translateY(-7px);
      }
    }

    @keyframes screenDone {
      0%, 76% {
        opacity: 0;
        transform: translateY(9px) scale(0.95);
      }

      88%, 100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes loaderMove {
      0% {
        transform: translateX(-100%);
      }

      100% {
        transform: translateX(250%);
      }
    }

    @keyframes dotPulse {

        opacity: 0.35;
        transform: scale(0.72);
      }

      50% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes slotGlow {
      0%, 18%, 72%, 100% {
        box-shadow:
          inset 0 2px 6px rgba(0, 0, 0, 0.56),
          0 0 0 rgba(134, 239, 172, 0);
      }

      34%, 56% {
        box-shadow:
          inset 0 2px 6px rgba(0, 0, 0, 0.56),
          0 0 18px rgba(134, 239, 172, 0.58),
          0 0 38px rgba(134, 239, 172, 0.24);
      }
    }

        left: -44%;
        opacity: 0;
      }

      34% {

      }

      62% {

        opacity: 1;
      }

      100% {

        opacity: 0;
      }

      }

      }

    @keyframes keypadTap {

      }

      55% {

      }
    }

    @keyframes approvePulse {
      0%, 56%, 100% {
        transform: translateY(0);

        box-shadow:

      72%, 88% {

    @keyframes contactPulse {

        transform: scale(0.95);
      }

      55%, 78% {

        transform: scale(1.06);

      }

      }

      }

      38% {

      }

      62% {

    @keyframes hintProcessing {

        transform: translateY(0);
      }

      }

        transform: translateY(5px);
      }

      54%, 70% {
        opacity: 1;
        transform: translateY(0);
      }

      80%, 100% {

    @keyframes hintDone {

        transform: translateY(5px);
      }

      88%, 100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 420px) {
      body {
        padding: 16px;
      }

      .confirm-modal {
        padding: 22px 16px 18px;
        border-radius: 24px;
      }

      .shop-terminal-stage {

      .shop-terminal-device {

      }

      .shop-terminal-card-swipe {
        width: min(196px, 82%);
      }

      .receipt {
        width: 122px;
      }

    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }

      .shop-terminal-screen__state--done,
      .receipt,
      .meter__hint--done {
        opacity: 1;
        transform: none;
      }

      .shop-terminal-card-swipe {
        opacity: 0;
      }
    }
  </style>
</head>
