<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>이동중 실루엣 테스트</title>
  <style>
    :root {
      --accent: #2f7a55;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: transparent;
      font-family: "Pretendard", "Noto Sans KR", sans-serif;
      color: #143e2c;
    }

    .stage {
      position: relative;
      width: min(860px, 100vw);
      height: min(420px, 100vh);
      overflow: hidden;
      background: transparent;
    }

    .status {
      position: absolute;
      left: 50%;
      top: 42px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 22px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid rgba(47, 122, 85, 0.22);
      color: var(--accent);
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -0.04em;
      transform: translateX(-50%);
      box-shadow: 0 18px 32px rgba(33, 77, 57, 0.14);
    }

    .dots span {
      opacity: 0.22;
      animation: dotPulse 1.05s infinite;
    }

    .dots span:nth-child(2) {
      animation-delay: 0.16s;
    }

    .dots span:nth-child(3) {
      animation-delay: 0.32s;
    }

    .vehicle-track {
      position: absolute;
      left: 50%;
      bottom: 72px;
      width: 680px;
      height: 220px;
      transform: translateX(-50%);
      animation: bodyFloat 0.7s ease-in-out infinite alternate;
    }

    .vehicle-wrap {
      position: absolute;
      left: 50%;
      bottom: -14px;
      width: 680px;
      height: 220px;
      transform: translateX(-50%);
      animation: driveAcross 3.2s ease-in-out infinite;
    }

    .vehicle-image {
      display: block;
      width: 680px;
      height: 220px;
      object-fit: contain;
      user-select: none;
      pointer-events: none;
    }

    @keyframes driveAcross {
      0%, 100% {
        transform: translateX(-53%) translateY(0) scaleX(1);
      }
      48% {
        transform: translateX(-47%) translateY(-3px) scaleX(1.01);
      }
    }

    @keyframes bodyFloat {
      from {
        transform: translateX(-50%) translateY(0);
      }
      to {
        transform: translateX(-50%) translateY(-4px);
      }
    }

    @keyframes dotPulse {
      0%, 100% {
        opacity: 0.18;
        transform: translateY(0);
      }
      45% {
        opacity: 1;
        transform: translateY(-2px);
      }
    }
  </style>
</head>
<body>
  <main class="stage" aria-label="이동중 실루엣 애니메이션">
    <div class="status">
      이동중
      <span class="dots" aria-hidden="true"><span>.</span><span>.</span><span>.</span></span>
    </div>
    <section class="vehicle-track">
      <div class="vehicle-wrap">
        <img class="vehicle-image" src="/animation-moving-silhouette.png" alt="이동중 차량 실루엣" />
      </div>
    </section>
  </main>
</body>
</html>
